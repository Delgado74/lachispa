name: Compilar APKs (fork)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split APKs per ABI
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          SHA=${GITHUB_SHA::7}
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk              release-apks/lachispa-universal-${SHA}.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk    release-apks/lachispa-arm64-v8a-${SHA}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/lachispa-armeabi-v7a-${SHA}.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      release-apks/lachispa-x86_64-${SHA}.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-apks/*.apk
          if-no-files-found: error