name: Compilar APKs (fork)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a compilar'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - feat/46-facturas-sin-monto
          - feat/117-valor-fiat-entonces-ahora
          - feat/hce-receive
          - feat/nfc-payment-only
          - feat/total
          - feature/invoice-key-clean
          - feature/qr-from-gallery
          - fix/clear-invoice-removes-from-history
          - fix/mounted-guard-amount-screen

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build arm64-v8a APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error